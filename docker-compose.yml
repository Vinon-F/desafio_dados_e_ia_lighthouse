version: '3.8'

services:
  db:
    image: postgres:15
    container_name: desafio_lighthouse
    restart: always
    environment:
      POSTGRES_USER: seu_user_aqui
      POSTGRES_PASSWORD: sua_senha_aqui
      POSTGRES_DB: db_lighthouse
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data

volumes:
  dados_postgres: